<!DOCTYPE html>

<html>

<head>
    <title>Пример 01.04 - Материалы, свет и анимация | Example 01.04 - Materials, light and animation</title>
    <script type="text/javascript" src="../libs/three.js"></script>
    <script type="text/javascript" src="../libs/jquery-1.9.0.js"></script>
    <script type="text/javascript" src="../libs/stats.js"></script>
    <style>
        body{
            /* устанавливаем поле равным 0, а переполнение скрытым, чтобы 
			используйте полную страницу */
			/* set margin to 0 and overflow to hidden, to go fullscreen */
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

<div id="Stats-output">
</div>

<!-- Div, который будет содержать вывод -->
<!-- Div which will hold the Output -->
<div id="WebGL-output">
</div>

<!-- Код Javascript, который запускает наши примеры Three.js -->
<!-- Javascript code that runs our Three.js examples -->
<script type="text/javascript">

    // как только все загрузится, мы запускаем наш файл Three.js.
    // once everything is loaded, we run our Three.js stuff.
    $(function () {

        var stats = initStats();

        // Создаем сцену, которая будет содержать все наши элементы, такие как объекты, камеры и источники света.
        // create a scene, that will hold all our elements such as objects, cameras and lights.
        var scene = new THREE.Scene();

        // Создаем камеру, которая определяет, куда мы смотрим.
        // create a camera, which defines where we're looking at.
        var camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);

        // Создать объект рендер и задать его размер
        // create a render and set the size
        var renderer = new THREE.WebGLRenderer();

        renderer.setClearColorHex(0xEEEEEE, 1.0);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMapEnabled = true;

        // создать плоскость земли
        // create the ground plane
        var planeGeometry = new THREE.PlaneGeometry(60,20,1,1);
        var planeMaterial =    new THREE.MeshLambertMaterial({color: 0xffffff});
        var plane = new THREE.Mesh(planeGeometry,planeMaterial);
        plane.receiveShadow  = true;

        // Повернуть и расположить плоскость
        // rotate and position the plane
        plane.rotation.x=-0.5*Math.PI;
        plane.position.x=15
        plane.position.y=0
        plane.position.z=0

        // Добавить плоскость к сцене
        // add the plane to the scene
        scene.add(plane);

        // создать куб
        // create a cube
        var cubeGeometry = new THREE.CubeGeometry(4,4,4);
        var cubeMaterial = new THREE.MeshLambertMaterial({color: 0xff0000});
        var cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
        cube.castShadow = true;

        // расположить куб
        // position the cube
        cube.position.x=-4;
        cube.position.y=3;
        cube.position.z=0;

        // Добавить куб к сцене
        // add the cube to the scene
        scene.add(cube);

        // создать сферу
        // create a sphere
        var sphereGeometry = new THREE.SphereGeometry(4,20,20);
        var sphereMaterial = new THREE.MeshLambertMaterial({color: 0x7777ff});
        var sphere = new THREE.Mesh(sphereGeometry,sphereMaterial);

        // расположить сферу
        // position the sphere
        sphere.position.x=20;
        sphere.position.y=0;
        sphere.position.z=2;
        sphere.castShadow=true;

        // Добавить сферу к сцене
        // add the sphere to the scene
        scene.add(sphere);

        // Расположите и направьте камеру в центр сцены
        // position and point the camera to the center of the scene
        camera.position.x = -30;
        camera.position.y = 40;
        camera.position.z = 30;
        camera.lookAt(scene.position);

        // добавляем мягкое окружающее освещение
        // add subtle ambient lighting
        var ambientLight = new THREE.AmbientLight(0x0c0c0c);
        scene.add(ambientLight);

        // Добавить прожектор для теней
        // add spotlight for the shadows
        var spotLight = new THREE.SpotLight( 0xffffff );
        spotLight.position.set( -40, 60, -10 );
        spotLight.castShadow = true;
        scene.add( spotLight );

        // Добавить вывод рендерера в HTML-элемент
        // add the output of the renderer to the html element
        $("#WebGL-output").append(renderer.domElement);

        // Вызов функции рендеринга
        // call the render function
        var step=0;
        render();

        function render() {
            stats.update();
            // вращаем куб вокруг своей оси
            // rotate the cube around its axes
            cube.rotation.x += 0.02;
            cube.rotation.y += 0.02;
            cube.rotation.z += 0.02;

            // подбрасываем сферу вверх и вниз
            // bounce the sphere up and down
            step+=0.04;
            sphere.position.x = 20+( 10*(Math.cos(step)));
            sphere.position.y = 2 +( 10*Math.abs(Math.sin(step)));

            // рендеринг с использованием requestAnimationFrame
            // render using requestAnimationFrame
            requestAnimationFrame(render);
            renderer.render(scene, camera);
        }

        function initStats() {

            var stats = new Stats();

            stats.setMode(0); // 0: fps, 1: ms

            // Выравниваем верхний левый угол
            // Align top-left
            stats.domElement.style.position = 'absolute';
            stats.domElement.style.left = '0px';
            stats.domElement.style.top = '0px';

            $("#Stats-output").append( stats.domElement );

            return stats;
        }
    });



</script>
</body>
</html>
